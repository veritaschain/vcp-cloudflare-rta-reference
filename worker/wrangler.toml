name = "vcp-ingest-worker"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Production secrets (provided after NDA execution)
# Set via: wrangler secret put <SECRET_NAME>
#
# INGEST_TOKEN   - Sidecar authentication token
# VCP_LOGGING_URL - ████████████████████████████████
# VCP_API_KEY    - ████████████████████████████████
# All three bindings are required for POST ingestion. Tokens must be nonempty
# visible ASCII without whitespace; VCP_LOGGING_URL must be HTTPS without URL
# credentials or a fragment. Missing/invalid configuration returns 503.

[[routes]]
pattern = "████████████████████/ingest/*"
zone_name = "████████████"
